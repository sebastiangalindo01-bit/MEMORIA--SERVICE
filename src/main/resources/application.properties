spring.application.name=memoria-service
server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/memoria}
spring.datasource.username=${DB_USERNAME:memoria}
spring.datasource.password=${DB_PASSWORD:memoria-local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

asignador.service.url=${ASIGNADOR_URL:http://localhost:8080}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/gestor-memoria}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/gestor-memoria/protocol/openid-connect/certs}
