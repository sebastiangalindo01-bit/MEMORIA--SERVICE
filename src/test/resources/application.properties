spring.datasource.url=jdbc:h2:mem:memoria-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/gestor-memoria
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/gestor-memoria/protocol/openid-connect/certs
